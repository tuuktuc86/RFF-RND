name: rff-rnd
dependencies:
  - python=3.10
  - pip
  - pip:
      # Shared Python dependencies for offline and online RL.
      - "torch>=2.0"
      - "numpy<2"
      - "hydra-core>=1.3,<1.4"
      - "omegaconf>=2.3,<2.4"
      - "tensorboard"
      - "opencv-python<4.12"
      - "Pillow"
      - "nvidia-ml-py"

      # Legacy Gym environments and D4RL datasets.
      - "gym[atari,accept-rom-license]==0.23.1"
      - "mujoco-py==2.1.2.14"
      - "Cython<3"
      - "d4rl @ git+https://github.com/Farama-Foundation/D4RL.git"
